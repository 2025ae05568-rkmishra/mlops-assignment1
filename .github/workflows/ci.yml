name: Verify ML pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLCONFIGDIR: /tmp/mlops-matplotlib
      MLFLOW_DISABLE_AGENT_HINT: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked environment
        run: make setup
      - name: Lint and unit tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/evidence/runtime
          make lint unit 2>&1 | tee reports/evidence/runtime/lint-unit.log
      - name: Acquire, EDA and train (training partition CV only)
        shell: bash
        run: |
          set -euo pipefail
          make train 2>&1 | tee reports/evidence/runtime/training.log
      - name: Verify selected artifact, API parity and manifests
        shell: bash
        run: |
          set -euo pipefail
          make package integration 2>&1 | tee reports/evidence/runtime/integration.log
          kubectl kustomize deploy/k8s/overlays/minikube > reports/evidence/runtime/rendered-manifests.yaml
      - name: Build and isolated serving test (AMD64 runner)
        shell: bash
        run: |
          set -euo pipefail
          make docker-build docker-smoke 2>&1 | tee reports/evidence/runtime/docker.log
      - name: Preserve every run's available evidence and model
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pipeline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/
            data/manifests/
            artifacts/model/current/
            artifacts/release.json
            mlflow.db
            mlruns/
          retention-days: 30
          if-no-files-found: warn
