<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cleveland API Operations</title>
<style>body{font-family:system-ui;background:#f3f5f8;color:#192d40;margin:0;padding:36px;max-width:1250px}h1{margin:8px 0;font-size:34px}.subtitle{color:#526478}#status{padding:16px;background:white;border-radius:10px;margin:24px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:white;padding:24px;border:1px solid #dbe2ea;border-radius:12px}.value{font-size:32px;font-weight:650;margin:12px 0}.unit{font-size:14px;color:#526478}svg{width:100%;height:150px;background:#f7fafc}.query{font-family:monospace;font-size:11px;overflow-wrap:anywhere;color:#526478}.footer{margin-top:25px;color:#526478}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body>
<p class="subtitle">MLOps Assignment 1 · local operational evidence</p><h1>Cleveland API Operations</h1><p class="subtitle">Live Prometheus metrics · last 5 minutes · refresh every 5 seconds</p><div id="status">Connecting to Prometheus…</div><div class="grid" id="panels"></div><p class="footer">Service behavior only. Educational model; no clinical accuracy or drift claims. Prometheus history is ephemeral.</p>
<script>
const finite=v=>Number.isFinite(Number(v));
function draw(values){const points=values.filter(v=>finite(v[1]));if(!points.length)return '<text x="20" y="70" fill="#526478">Awaiting traffic and scrape samples</text>';const ys=points.map(v=>Number(v[1])),lo=Math.min(0,...ys),hi=Math.max(...ys,lo+0.001);const coords=points.map((v,i)=>`${20+i*460/Math.max(points.length-1,1)},${130-(Number(v[1])-lo)*110/(hi-lo)}`).join(' ');return `<polyline fill="none" stroke="#167c80" stroke-width="3" points="${coords}"/><text x="20" y="148" font-size="10" fill="#526478">5 minutes ago</text><text x="455" y="148" font-size="10" fill="#526478">now</text>`;}
async function refresh(){try{const r=await fetch('/api/snapshot');if(!r.ok)throw Error('Metrics unavailable');const s=await r.json();document.getElementById('status').textContent='Scrape targets: '+s.targets.map(t=>t.pod+' '+t.health.toUpperCase()).join(' · ')+' | Updated '+new Date(s.captured_at*1000).toLocaleTimeString();const root=document.getElementById('panels');root.replaceChildren();for(const p of s.panels){const v=p.series[0]?.values||[];const current=v.filter(x=>finite(x[1])).at(-1);const card=document.createElement('section');card.className='card';const h=document.createElement('h2');h.textContent=p.title;card.append(h);const value=document.createElement('div');value.className='value';value.textContent=current?Number(current[1]).toFixed(p.unit==='replicas'?0:4):'Awaiting samples';card.append(value);const unit=document.createElement('p');unit.className='unit';unit.textContent=p.unit;card.append(unit);const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 500 155');svg.innerHTML=draw(v);card.append(svg);const q=document.createElement('p');q.className='query';q.textContent=p.query;card.append(q);root.append(card);}}catch(e){document.getElementById('status').textContent=e.message;}}
refresh();setInterval(refresh,5000);
</script></body></html>
