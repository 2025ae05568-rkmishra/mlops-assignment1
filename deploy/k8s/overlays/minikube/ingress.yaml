apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heart-disease-api
spec:
  ingressClassName: traefik
  rules:
    - host: heart-disease.test
      http:
        paths:
          - path: /predict
            pathType: Exact
            backend:
              service:
                name: heart-disease-api
                port:
                  number: 80
          - path: /health
            pathType: Exact
            backend:
              service:
                name: heart-disease-api
                port:
                  number: 80
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: heart-disease-api
                port:
                  number: 80
          - path: /version
            pathType: Exact
            backend:
              service:
                name: heart-disease-api
                port:
                  number: 80
          - path: /docs
            pathType: Exact
            backend:
              service:
                name: heart-disease-api
                port:
                  number: 80
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: heart-disease-api
                port:
                  number: 80
